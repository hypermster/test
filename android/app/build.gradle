plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hypermster.siege'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hypermster.siege'
        minSdk 24
        targetSdk 34
        // Each CI build gets a higher version so it installs over the previous one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // A fixed debug key (well-known password "android") so every build can
        // update the previous install without wiping the saved campaign.
        shared {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
